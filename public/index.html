<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Downloader</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.95);
      --border: rgba(255,255,255,0.08);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --primary: #10b981;
      --primary-dark: #059669;
      --warning: #f59e0b;
      --error: #ef4444;
      --success: #10b981;
      --shadow: rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #020817, #0f172a);
      color: var(--text);
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px var(--shadow);
    }

    .card-full {
      grid-column: 1 / -1;
    }

    h1, h2 {
      margin: 0 0 20px;
      font-size: 1.8rem;
    }

    h2 {
      font-size: 1.3rem;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 16px;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
      font-family: monospace;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .status {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      color: var(--warning);
      font-size: 0.95rem;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .status.success { color: var(--success); }
    .status.error { color: var(--error); }
    .status.warning { color: var(--warning); }

    .downloads-list {
      max-height: 300px;
      overflow-y: auto;
    }

    .download-item {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--muted);
    }

    .download-item:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card card-full">
      <h1>🎵 Descargador de música</h1>
    </div>

    <div class="card">
      <h2>Descargar URL</h2>

      <label for="singleUrl">URL</label>
      <input id="singleUrl" type="url" placeholder="https://www.youtube.com/watch?v=..." />

      <div class="row">
        <div>
          <label for="format">Formato</label>
          <select id="format">
            <option value="mp3">MP3</option>
            <option value="m4a">M4A</option>
            <option value="wav">WAV</option>
            <option value="opus">OPUS</option>
          </select>
        </div>
        <div>
          <label for="quality">Calidad</label>
          <select id="quality">
            <option value="0">Automática</option>
            <option value="9">Baja</option>
            <option value="5">Media</option>
            <option value="2">Alta</option>
          </select>
        </div>
      </div>

      <label class="checkbox-group">
        <input type="checkbox" id="audioOnly" checked />
        <span>Extraer solo audio</span>
      </label>

      <button id="downloadBtn">⬇️ Descargar</button>

      <div id="status" class="status warning">
        Ingresa una URL válida y presiona "Descargar".
      </div>
    </div>

    <div class="card">
      <h2>Descargas recientes</h2>
      <div id="downloadsList" class="downloads-list">
        <div class="download-item">Cargando...</div>
      </div>
      <button id="refreshBtn" style="margin-top: 12px;">🔄 Actualizar</button>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const downloadsList = document.getElementById("downloadsList");

    function setStatus(msg, type = "warning") {
      statusEl.textContent = msg;
      statusEl.className = `status ${type}`;
    }

    async function loadDownloads() {
      try {
        const res = await fetch("/api/list-downloads");
        const data = await res.json();
        if (!data.files || data.files.length === 0) {
          downloadsList.innerHTML = '<div class="download-item">No hay descargas aún.</div>';
          return;
        }

        downloadsList.innerHTML = data.files
          .map(
            (file) =>
              `<div class="download-item"><strong>${file.name}</strong><br><small>${file.size} • ${file.modified}</small></div>`
          )
          .join("");
      } catch (e) {
        downloadsList.innerHTML = '<div class="download-item">No se pudieron cargar las descargas.</div>';
      }
    }

    document.getElementById("downloadBtn").addEventListener("click", async () => {
      const url = document.getElementById("singleUrl").value.trim();
      const format = document.getElementById("format").value;
      const quality = document.getElementById("quality").value;
      const audioOnly = document.getElementById("audioOnly").checked;

      if (!url) {
        setStatus("❌ Debes ingresar una URL válida.", "error");
        return;
      }

      const btn = document.getElementById("downloadBtn");
      btn.disabled = true;
      btn.textContent = "⏳ Descargando...";
      setStatus("⏳ Descargando...", "warning");

      try {
        const response = await fetch("/api/download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, format, quality, audioOnly })
        });

        const contentType = response.headers.get("content-type") || "";

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error || "Error desconocido");
        }

        // Si el servidor devuelve un archivo binario, lo descargamos directamente
        if (contentType.includes("audio/") || contentType.includes("application/octet-stream") || contentType.includes("application/zip")) {
          const blob = await response.blob();
          const fileName = "audio." + format;
          const urlObj = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = urlObj;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(urlObj);

          setStatus("✅ Descarga iniciada correctamente.", "success");
          await loadDownloads();
          return;
        }

        const data = await response.json();
        if (!data.success) {
          throw new Error(data.error || "No se pudo descargar.");
        }

        setStatus("✅ Descarga completada.", "success");
        await loadDownloads();
      } catch (error) {
        setStatus(`❌ ${error.message}`, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "⬇️ Descargar";
      }
    });

    document.getElementById("refreshBtn").addEventListener("click", loadDownloads);
    loadDownloads();
  </script>
</body>
</html>
